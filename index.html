<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <!-- Toggle Buttons -->
    <div class="toggle-buttons">
      <button class="toggle-btn active" onclick="showSignIn()">Sign In</button>
      <button class="toggle-btn" onclick="showSignUp()">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <div id="signIn" class="form-section">
      <h2>Sign In</h2>
      <form onsubmit="handleSignIn(event)">
        <label for="signin-username">Username:</label>
        <input type="text" id="signin-username" name="username" required>

        <label for="signin-password">Password:</label>
        <input type="password" id="signin-password" name="password" required>

        <button type="submit">Sign In</button>
        <p id="signin-message" class="message"></p>
      </form>
    </div>

    <!-- Sign Up Form -->
    <div id="signUp" class="form-section hidden">
      <h2>Sign Up</h2>
      <form onsubmit="handleSignUp(event)">
        <label for="signup-email">Email:</label>
        <input type="email" id="signup-email" name="email" required>

        <label for="signup-username">Username:</label>
        <input type="text" id="signup-username" name="username" required>

        <label for="signup-password">Password:</label>
        <input type="password" id="signup-password" name="password" required>

        <label for="signup-confirm">Confirm Password:</label>
        <input type="password" id="signup-confirm" name="confirm" required>

        <button type="submit">Sign Up</button>
        <p id="signup-message" class="message"></p>
      </form>
    </div>
  </div>

  <script>
    function showSignIn() {
      document.getElementById('signIn').classList.remove('hidden');
      document.getElementById('signUp').classList.add('hidden');
      document.querySelectorAll('.toggle-btn')[0].classList.add('active');
      document.querySelectorAll('.toggle-btn')[1].classList.remove('active');
    }

    function showSignUp() {
      document.getElementById('signUp').classList.remove('hidden');
      document.getElementById('signIn').classList.add('hidden');
      document.querySelectorAll('.toggle-btn')[0].classList.remove('active');
      document.querySelectorAll('.toggle-btn')[1].classList.add('active');
    }

    function handleSignIn(event) {
      event.preventDefault();
      const msg = document.getElementById('signin-message');
      msg.textContent = "Signing in...";
      msg.style.color = "#008080";

      setTimeout(() => {
        msg.textContent = "✅ Signed in successfully!";
        msg.style.color = "#ff69b4";
      }, 1500);
    }

    function handleSignUp(event) {
      event.preventDefault();
      const msg = document.getElementById('signup-message');
      msg.textContent = "Creating account...";
      msg.style.color = "#008080";

      setTimeout(() => {
        msg.textContent = "🎉 Account created successfully!";
        msg.style.color = "#ff69b4";
      }, 1500);
    }
  </script>
</body>
</html>
